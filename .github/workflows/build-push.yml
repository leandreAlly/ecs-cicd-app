name: Build and push to ECR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Test, build and push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run the test suite
        run: mvn -B test

      - name: Assume the ECR push role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_ROLE_ARN }}
          role-session-name: gha-ecr-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the image
        env:
          IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}
        run: |
          set -eo pipefail
          TAG="${GITHUB_SHA::7}"

          if aws ecr describe-images \
               --repository-name "${{ vars.ECR_REPOSITORY }}" \
               --image-ids "imageTag=$TAG" >/dev/null 2>&1; then
            echo "Image $TAG already exists - tags are immutable, nothing to push"
            exit 0
          fi

          docker build \
            --build-arg "VERSION=$TAG" \
            --build-arg "COMMIT=$GITHUB_SHA" \
            --build-arg "BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag "$IMAGE:$TAG" \
            .

          docker push "$IMAGE:$TAG"
          echo "Pushed $IMAGE:$TAG"
